name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-stream:
    name: guest streaming exec protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build guest agent with warnings as errors
        run: make -C vmm/guest/agent CFLAGS="-O2 -Wall -Wextra -Werror -pedantic"
      - name: Test real guest pipe and PTY handlers without KVM
        run: timeout 60s python3 vmm/guest/agent/test-stream-exec.py

  musl:
    name: build release targets (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install zig
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-zigbuild

      - name: Check attached volume portability
        working-directory: orch
        run: cargo check --locked --target x86_64-unknown-linux-musl -p tarit-volume

      - name: Build VMM release target
        working-directory: vmm
        run: >-
          cargo zigbuild --locked --target x86_64-unknown-linux-musl
          -p vmm --features boot

  sdk:
    name: generate / type-check / test (SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK toolchains
        run: |
          python -m pip install uv==0.9.30
          npm ci --prefix sdk/typescript

      - name: Verify generated clients are current
        run: |
          ./sdk/generate.sh
          git diff --exit-code -- sdk/python sdk/typescript/src/generated sdk/typescript/LICENSE

      - name: Check Python SDK
        run: |
          uv run --project sdk/python python sdk/verify_release.py
          uv run --project sdk/python --with mypy==2.3.1 mypy --strict \
            sdk/python/tarit_sdk/high_level.py sdk/verify_release.py
          uvx --from ruff==0.16.5 ruff check \
            sdk/python-high-level sdk/python/tarit_sdk sdk/tests/python sdk/verify_release.py
          uv run --project sdk/python python -m unittest discover -s sdk/tests/python -v

      - name: Check TypeScript SDK
        run: |
          npm --prefix sdk/typescript run check
          npm --prefix sdk/typescript test
          npm --prefix sdk/typescript run build

      - name: Check ComputeSDK adapter
        run: |
          npm ci --ignore-scripts --prefix sdk/computesdk
          npm --prefix sdk/computesdk run typecheck
          npm --prefix sdk/computesdk test

      - name: Test benchmark API contract
        run: python -m unittest discover -s scripts/tests -v

  postgres:
    name: PostgreSQL integration (required)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tarit_test
          POSTGRES_PASSWORD: tarit_test
          POSTGRES_DB: tarit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarit_test -d tarit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TARIT_TEST_DATABASE_URL: postgres://tarit_test:tarit_test@127.0.0.1:5432/tarit_test?sslmode=disable
      TARIT_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: orch

      - name: Test against PostgreSQL
        working-directory: orch
        # These tests migrate a shared disposable schema. The required flag
        # makes a missing database fail instead of silently skipping coverage.
        run: cargo test --locked -p tarit-fleet -p taritd -- --test-threads=1

  macos:
    name: native macOS / clippy / tests (${{ matrix.workspace }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [vmm, orch]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Format
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test native non-KVM paths
        working-directory: ${{ matrix.workspace }}
        run: cargo test --locked --workspace

  check:
    name: check / test / clippy / fmt (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [proto, vmm, orch]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Test snapshot-disk harness contract
        if: matrix.workspace == 'orch'
        run: |
          python3 -m unittest orch/tests/test_e2e_snapshot_disk.py -v
          bash -n orch/tests/e2e_snapshot_disk.sh

      - name: Install ext4 image test tools
        if: matrix.workspace == 'vmm'
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      - name: Format
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check
        working-directory: ${{ matrix.workspace }}
        run: cargo check --locked --workspace --all-targets

      - name: Test (non-KVM unit tests)
        working-directory: ${{ matrix.workspace }}
        env:
          TARIT_REQUIRE_E2FSPROGS: ${{ matrix.workspace == 'vmm' && '1' || '0' }}
        run: cargo test --locked --workspace

      - name: Test lifecycle soak supervisor
        if: matrix.workspace == 'orch'
        run: |
          python3 -m unittest orch/tests/test_continuous_lifecycle_soak.py
          bash -n orch/tests/continuous_mixed_oci_soak.sh

      - name: Type-check KVM/Linux code paths
        if: matrix.workspace == 'vmm'
        working-directory: ${{ matrix.workspace }}
        run: >-
          cargo check --locked --workspace --all-targets
          --features vmm-core/kvm
          --features vmm-core/boot
          --features vmm-memory-backend/kvm
          --features vmm-integration/kvm

      - name: Lint KVM/Linux code paths
        if: matrix.workspace == 'vmm'
        working-directory: ${{ matrix.workspace }}
        run: >-
          cargo clippy --locked --workspace --all-targets
          --features vmm-core/kvm
          --features vmm-core/boot
          --features vmm-memory-backend/kvm
          --features vmm-integration/kvm
          -- -D warnings

# The full KVM integration suite
# (cargo test --workspace --features kvm -- --include-ignored) requires a Linux
# host with /dev/kvm, which GitHub-hosted runners do not provide. Run it on a
# Linux+KVM host.
