name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oss-boundary:
    name: standalone dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Reject product-specific and out-of-tree dependencies
        run: |
          python3 scripts/check_oss_boundary.py
          python3 -m unittest test/test_oss_boundary.py -v

  musl:
    name: build release targets (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install zig
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-zigbuild

      - name: Check attached volume portability
        working-directory: orch
        run: cargo check --locked --target x86_64-unknown-linux-musl -p tarit-volume

      - name: Build VMM release target
        working-directory: vmm
        run: >-
          cargo zigbuild --locked --target x86_64-unknown-linux-musl
          -p vmm --features boot

  sdk:
    name: generate / type-check / test (SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK toolchains
        run: |
          python -m pip install uv==0.9.30
          npm ci --prefix sdk/typescript

      - name: Verify generated clients are current
        run: |
          ./sdk/generate.sh
          git diff --exit-code -- sdk/python sdk/typescript/src/generated sdk/typescript/LICENSE

      - name: Check Python SDK
        run: |
          uv run --project sdk/python python sdk/verify_release.py
          uv run --project sdk/python --with mypy==2.3.1 mypy --strict \
            sdk/python/tarit_sdk/high_level.py sdk/verify_release.py
          uvx --from ruff==0.16.5 ruff check \
            sdk/python-high-level sdk/python/tarit_sdk sdk/tests/python sdk/verify_release.py
          uv run --project sdk/python python -m unittest discover -s sdk/tests/python -v

      - name: Check TypeScript SDK
        run: |
          npm --prefix sdk/typescript run check
          npm --prefix sdk/typescript test
          npm --prefix sdk/typescript run build

  check:
    name: check / test / clippy / fmt (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [proto, vmm, orch]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Format
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        working-directory: ${{ matrix.workspace }}
        run: cargo check --workspace --all-targets

      - name: Test (non-KVM unit tests)
        working-directory: ${{ matrix.workspace }}
        run: cargo test --workspace

      - name: Test lifecycle soak supervisor
        if: matrix.workspace == 'orch'
        run: |
          python3 -m unittest orch/tests/test_continuous_lifecycle_soak.py
          bash -n orch/tests/continuous_mixed_oci_soak.sh

      - name: Type-check KVM/Linux code paths
        if: matrix.workspace == 'vmm'
        working-directory: ${{ matrix.workspace }}
        run: >-
          cargo check --workspace --all-targets
          --features vmm-core/kvm
          --features vmm-core/boot
          --features vmm-memory-backend/kvm
          --features vmm-integration/kvm

      - name: Lint KVM/Linux code paths
        if: matrix.workspace == 'vmm'
        working-directory: ${{ matrix.workspace }}
        run: >-
          cargo clippy --workspace --all-targets
          --features vmm-core/kvm
          --features vmm-core/boot
          --features vmm-memory-backend/kvm
          --features vmm-integration/kvm
          -- -D warnings

# The full KVM integration suite
# (cargo test --workspace --features kvm -- --include-ignored) requires a Linux
# host with /dev/kvm, which GitHub-hosted runners do not provide. Run it on a
# Linux+KVM host.
