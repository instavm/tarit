name: Prepare manual KVM validation

# Privileged hardware execution is intentionally outside Actions. A PR can
# change workflow YAML, so labels and a main-only job if are not a trust boundary.
on:
  workflow_dispatch:
    inputs:
      trusted_sha:
        description: Full reviewed main commit SHA (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'instavm/tarit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate immutable main commit without executing its code
        env:
          TRUSTED_SHA: ${{ inputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'A full lowercase commit SHA is required.' >&2; exit 1;
          }
          test "$(git rev-parse "$TRUSTED_SHA^{commit}")" = "$TRUSTED_SHA"
          git merge-base --is-ancestor "$TRUSTED_SHA" refs/remotes/origin/main
          {
            echo '## Manual KVM validation required'
            printf 'Eligible immutable commit: `%s`\n\n' "$TRUSTED_SHA"
            echo 'This job did not run KVM tests and is not hardware validation evidence.'
            echo 'An operator must review this exact SHA, create a fresh disposable KVM VM with no credentials or production access, and follow docs/KVM_VALIDATION.md from that SHA.'
            echo 'Destroy the VM and its disks after the single run, including on failure.'
          } >> "$GITHUB_STEP_SUMMARY"
