            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "400":
          description: Malformed request
        "401":
          description: Missing or invalid API key
        "404":
          description: Branch or artifact not found for this tenant
        "409":
          description: Requested VM id already exists
        "429":
          description: Tenant quota or node disk pressure prevents restore
        "503":
          description: No healthy verified artifact replica is reachable or replication policy is not satisfied
  /v1/branches/{id}/fork:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: forkBranch
      summary: Fork an isolated VM from a branch head
      description: Alias of branch restore for clients expressing branch lineage as a fork. The child receives a new VM identity and isolated writable state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBranchRequest"
      responses:
        "201":
          description: Forked VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "400":
          description: Malformed request
        "401":
          description: Missing or invalid API key
        "404":
          description: Branch or artifact not found for this tenant
        "409":
          description: Requested VM id already exists
        "429":
          description: Tenant quota or node disk pressure prevents fork
        "503":
          description: No healthy verified artifact replica is reachable or replication policy is not satisfied
