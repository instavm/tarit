  /v1/branches/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: restoreBranch
      summary: Restore an isolated VM from a branch head
      description: Restores the immutable branch-head artifact on this node. In clustered mode, a missing local replica is streamed from a healthy verified peer over authenticated mTLS, fully integrity-verified, and published into the fleet replica index before boot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBranchRequest"
