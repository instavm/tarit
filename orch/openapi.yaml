openapi: 3.1.0
info:
  title: Tarit Orchestrator API
  version: 0.1.0
  description: Host orchestrator HTTP API (identical on every node behind external LB).
servers:
  - url: http://localhost:8080
    description: Current host (rewritten from Host header when served)
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key mapped by taritd to a tenant and role (admin or user).
  schemas:
    Branch:
      type: object
      required: [branch_id, name, head_artifact_id, revision, created_at, updated_at]
      properties:
        branch_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        head_artifact_id:
          type: string
          format: uuid
        source_vm_id:
          type: string
          format: uuid
        source_branch_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: uint64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EgressPolicy:
      type: object
      required: [vm_id, revision, allowlist, allow_existing, created_at, updated_at]
      properties:
        vm_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: uint64
          minimum: 1
        allowlist:
          type: array
          maxItems: 256
          items:
            type: string
            maxLength: 128
        allow_existing:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VmRecord:
      type: object
      description: Tenant-safe VM record. Host identity, filesystem paths, VMM socket, process id, boot arguments, and ownership metadata are never exposed.
      required: [id, status, revision, memory_mib, vcpus, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [creating, running, paused, suspended, hibernated, stopped, error]
        revision:
          type: integer
          format: uint64
          minimum: 1
        startup_path:
          type: string
          enum: [cold, warm, snapshot_restore]
          description: Definitive lifecycle branch used to start this VM. Absent only on legacy records.
        memory_mib:
          type: integer
        vcpus:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BalloonTargetRequest:
      type: object
      additionalProperties: false
      required: [target_mib]
      properties:
        target_mib:
          type: integer
          format: uint64
          minimum: 0
          description: Requested guest memory to return to the host; the VMM rejects targets larger than guest RAM.
    BalloonState:
      type: object
      required: [target_mib, actual_mib, target_pages, actual_pages]
      properties:
        target_mib:
          type: integer
          format: uint64
        actual_mib:
          type: integer
          format: uint64
        target_pages:
          type: integer
          format: uint32
        actual_pages:
          type: integer
          format: uint32
    CreateVmRequest:
      type: object
      additionalProperties: false
      description: All fields optional; defaults come from node configuration. Persistent block attachments are explicit, ordered after the root disk, exact-host constrained for local_block, and remain external across snapshot/hibernate operations.
      properties:
        id:
          type: string
          format: uuid
        memory_mib:
          type: integer
          default: 256
        vcpus:
          type: integer
          default: 1
        kernel_path:
          type: string
        image:
          type: string
        rootfs_path:
          type: string
        cmdline:
          type: string
        volumes:
          type: array
          maxItems: 15
          uniqueItems: true
          items:
            $ref: "#/components/schemas/VmVolumeAttachmentRequest"
    VmVolumeAttachmentRequest:
      type: object
      additionalProperties: false
      required: [volume_id, mode]
      properties:
        volume_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [read_only, read_write]
    VolumeCapabilities:
      type: object
      additionalProperties: false
      required: [read_only_many, read_write_once, read_write_many, snapshots, clones]
      properties:
        read_only_many:
          type: boolean
        read_write_once:
          type: boolean
        read_write_many:
          type: boolean
        snapshots:
          type: boolean
        clones:
          type: boolean
    Volume:
      type: object
      additionalProperties: false
      description: Tenant-safe persistent-volume record. Host identity, device paths, provider locators, credentials, and private errors are never exposed.
      required: [id, name, provider, storage_class, size_bytes, status, capabilities, generation, revision, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
        provider:
          type: string
          enum: [local_block]
        storage_class:
          type: string
          enum: [block, filesystem, object]
        size_bytes:
          type: integer
          format: uint64
          minimum: 1048576
        status:
          type: string
          enum: [creating, available, deleting, error]
        capabilities:
          $ref: "#/components/schemas/VolumeCapabilities"
        region:
          type: ["string", "null"]
        zone:
          type: ["string", "null"]
        generation:
          type: integer
          format: uint64
          minimum: 1
        revision:
          type: integer
          format: uint64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateVolumeRequest:
      type: object
      additionalProperties: false
      required: [name, size_bytes]
      properties:
        id:
          type: string
          format: uuid
          description: Optional client-selected identity for idempotent replay.
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
        size_bytes:
          type: integer
          format: uint64
          minimum: 1048576
          maximum: 1099511627776
        provider:
          type: string
          enum: [local_block]
          default: local_block
    RestoreRequest:
      type: object
      required: [snapshot_id]
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: Opaque snapshot handle. Physical storage paths and host placement are never public.
        id:
          type: string
          format: uuid
          description: Optional id for the restored VM; generated when omitted.
    RestoreBranchRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Optional id for the isolated restored VM; generated when omitted.
    ForkVmRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Optional child VM id; generated when omitted.
    ForkVmResponse:
      type: object
      required: [source_vm_id, vm]
      properties:
        source_vm_id:
          type: string
          format: uuid
        vm:
          $ref: "#/components/schemas/VmRecord"
    ExecuteRequest:
      type: object
      required: [vm_id, command]
      properties:
        vm_id:
          type: string
          format: uuid
        command:
          type: string
        timeout_ms:
          type: integer
          default: 30000
    ExecutionRecord:
      type: object
      required: [id, vm_id, command, timeout_ms, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        vm_id:
          type: string
          format: uuid
        command:
          type: string
        timeout_ms:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed]
        exit_code:
          type: ["integer", "null"]
        stdout:
          type: ["string", "null"]
        stderr:
          type: ["string", "null"]
        duration_ms:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PtySessionResponse:
      type: object
      required: [pty_id, vm_id, cols, rows, created_at]
      properties:
        pty_id:
          type: string
          format: uuid
        vm_id:
          type: string
          format: uuid
        cols:
          type: integer
        rows:
          type: integer
        shell:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
    SshKeyResponse:
      type: object
      required: [id, fingerprint, key_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: OpenSSH SHA256 fingerprint (`SHA256:` plus unpadded base64).
        key_type:
          type: string
        created_at:
          type: string
          format: date-time
    UsageSummary:
      type: object
      required: [api_key_id, owner_key, vm_runtime_seconds, exec_count, exec_duration_ms]
      properties:
        api_key_id:
          type: string
        owner_key:
          type: string
        vm_runtime_seconds:
          type: number
        exec_count:
          type: integer
        exec_duration_ms:
          type: integer
    AuditEvent:
      type: object
      required: [id, api_key_id, owner_key, host_id, action, outcome, created_at]
      properties:
        id:
          type: string
          format: uuid
        api_key_id:
          type: string
        owner_key:
          type: string
        host_id:
          type: string
        vm_id:
          type: ["string", "null"]
          format: uuid
        action:
          type: string
          enum: [create, delete, pause, suspend, resume, snapshot, restore, exec, attach_pty, ssh_attempt, update_egress, create_share, update_share, revoke_share, issue_share_token, create_volume, delete_volume]
        outcome:
          type: string
          enum: [attempt, ok, denied, error]
        detail:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
    ShareVisibility:
      type: string
      enum: [public, private]
      description: "`private` requires a valid share token at the gateway; `public` does not."
    ShareRecord:
      type: object
      required: [id, slug, owner_key, vm_id, guest_port, visibility, token_version, revoked_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Lowercase DNS label used as `<slug>.<TARIT_SHARE_DOMAIN>`.
        owner_key:
          type: string
          description: Tenant that owns the share.
        vm_id:
          type: string
          format: uuid
        guest_port:
          type: integer
          minimum: 1
          maximum: 65535
        visibility:
          $ref: "#/components/schemas/ShareVisibility"
        token_version:
          type: integer
          minimum: 0
          description: Version embedded in private-share tokens; it changes when an access-relevant share field changes or the share is revoked.
        revoked_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateShareRequest:
      type: object
      required: [vm_id, guest_port]
      additionalProperties: false
      properties:
        vm_id:
          type: string
          format: uuid
        guest_port:
          type: integer
          minimum: 1
          maximum: 65535
        visibility:
          $ref: "#/components/schemas/ShareVisibility"
          default: private
    UpdateShareRequest:
      type: object
      additionalProperties: false
      properties:
        vm_id:
          type: string
          format: uuid
        guest_port:
          type: integer
          minimum: 1
          maximum: 65535
        visibility:
          $ref: "#/components/schemas/ShareVisibility"
          description: When omitted, the share keeps its current visibility.
    ShareTokenResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Send only as the `X-Tarit-Share-Token` request header to a private share hostname.
        expires_at:
          type: string
          format: date-time
          description: UTC expiration computed from `TARIT_SHARE_TOKEN_TTL_SECS`.
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
paths:
  /openapi.yaml:
    get:
      operationId: getOpenapiSpec
      summary: OpenAPI specification (YAML)
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      operationId: getApiDocs
      summary: Interactive API documentation (Swagger UI)
      security: []
      responses:
        "200":
          description: HTML API explorer
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      operationId: getHealth
      summary: Health check for external load balancer
      security: []
      responses:
        "200":
          description: OK
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus operational metrics
      description: Admin-only Prometheus metrics. Tenant and VM labels are hashed unless explicitly configured otherwise. PTY metrics expose active connections, configured global/tenant/VM limits, and bounded-scope admission rejection counters without tenant or VM identifiers.
      responses:
        "200":
          description: Metrics in Prometheus text exposition format
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        "401":
          description: Missing or invalid API key
        "403":
          description: API key is not an admin key
  /v1/volumes:
    post:
      operationId: createVolume
      summary: Create a persistent volume
      description: Creates an opaque tenant-owned volume. Exact replay with the same id and immutable properties is idempotent. The initial local-block provider is exact-host constrained; provider paths are private.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVolumeRequest"
      responses:
        "201":
          description: Volume created and provider storage durable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        "200":
          description: Exact idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        "400":
          description: Invalid name or size
        "401":
          description: Missing or invalid API key
        "409":
          description: Identity/name conflict or deletion in progress
        "422":
          description: Requested provider is not configured
    get:
      operationId: listVolumes
      summary: List tenant volumes
      responses:
        "200":
          description: Tenant-scoped volume list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volume"
        "401":
          description: Missing or invalid API key
  /v1/volumes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getVolume
      summary: Get a tenant volume
      responses:
        "200":
          description: Tenant-safe volume record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        "401":
          description: Missing or invalid API key
        "404":
          description: Volume absent or belongs to another tenant
    delete:
      operationId: deleteVolume
      summary: Delete an unattached tenant volume
      description: Atomically verifies the volume is unattached and fences metadata before removing the exact provider object, fsyncing its parent, then removing metadata. Provider failure remains retryable.
      responses:
        "204":
          description: Provider object and metadata deleted
        "401":
          description: Missing or invalid API key
        "404":
          description: Volume absent or belongs to another tenant
        "409":
          description: Volume transition conflicts with another operation
  /v1/vms:
    get:
      operationId: listVms
      summary: List sandboxes
      description: User keys list their tenant's live or recoverable VMs; admin keys list all such records. Successfully deleted VMs are not returned.
      responses:
        "200":
          description: VM list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VmRecord"
        "401":
          description: Missing or invalid API key
    post:
      operationId: createVm
      summary: Create sandbox
      description: Creates a VM owned by the caller's tenant. Persistent volumes are acquired before VMM startup with an exclusive durable writer fence; local volumes pin placement to this exact host and bypass warm-pool reuse. Non-admin callers may set `image` (`name[:tag]`) or omit paths for node defaults outside production, but cannot set raw `kernel_path` or `rootfs_path`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVmRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "400":
          description: Malformed request body
        "401":
          description: Missing or invalid API key
        "403":
          description: Tenant VM quota reached
        "409":
          description: Conflict, such as a duplicate VM id, unavailable/foreign volume, stale generation, or occupied writer attachment
        "422":
          description: The image is legacy, mutable, corrupt, or was admitted under a different provenance policy
        "429":
          description: Capacity exhausted or admission timed out
          headers:
            Retry-After:
              description: Seconds the client should wait before retrying admission
              schema:
                type: integer
                minimum: 1
  /v1/vms/{id}:
    get:
      operationId: getVm
      summary: Get sandbox
      description: Returns a tenant-safe stored VM record. Host ids, paths, boot arguments, VMM sockets, and process ids are intentionally omitted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VM record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "503":
          description: Owning host is unhealthy, stale, or unavailable
    delete:
      operationId: deleteVm
      summary: Stop and remove sandbox
      description: User keys can delete only their tenant's VMs; admin keys can delete any VM.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Stopped
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
  /v1/vms/{id}/status:
    get:
      operationId: getVmStatus
      summary: Get live sandbox status
      description: Queries the owning VMM for a sanitized live runtime status. Host paths and device configuration remain internal. User keys can access only their tenant's VMs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Live VMM status
          content:
            application/json:
              schema:
                type: object
                required:
                  - state
                  - uptime_ms
                  - vcpus
                  - mem_mib
                  - vcpu_alive
                properties:
                  state:
                    type: string
                    enum: [created, running, paused, suspended, stopped]
                  uptime_ms:
                    type: integer
                    format: uint64
                  vcpus:
                    type: integer
                    minimum: 1
                  mem_mib:
                    type: integer
                    format: uint64
                  vcpu_alive:
                    type: boolean
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is stopped
        "503":
          description: Owning host is unhealthy, stale, or unavailable
  /v1/vms/{id}/balloon:
    get:
      operationId: getVmBalloon
      summary: Get virtio-balloon target and guest-reported size
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Balloon state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalloonState"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is not running or paused
    put:
      operationId: setVmBalloon
      summary: Set virtio-balloon target
      description: Audited and routed to the owning node. The target cannot exceed configured guest RAM.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalloonTargetRequest"
      responses:
        "200":
          description: Updated balloon state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalloonState"
        "400":
          description: Target exceeds guest RAM or request is invalid
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is not running or paused
  /v1/vms/{id}/pty/sessions:
    post:
      operationId: createPtySession
      summary: Create PTY session
      description: Registers an interactive PTY session for the VM. Tokens are one-time and expire after five minutes. At most 32 pending sessions may exist per VM. PTY routes operate on the VM's owning node only; on a non-owner node they return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols:
                  type: integer
                  minimum: 1
                rows:
                  type: integer
                  minimum: 1
                shell:
                  type: string
                  description: Shell to launch in the guest; the guest agent default is used when omitted.
      responses:
        "201":
          description: PTY session created
          content:
            application/json:
              schema:
                type: object
                required: [pty_id, cols, rows, connect_token]
                properties:
                  pty_id:
                    type: string
                    format: uuid
                  cols:
                    type: integer
                  rows:
                    type: integer
                  connect_token:
                    type: string
                    description: Per-session token passed as the `token` query parameter on the WebSocket connect route.
        "400":
          description: cols or rows is zero
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is owned by another node; connect to the owner
        "429":
          description: Pending or active PTY capacity is exhausted
    get:
      operationId: listPtySessions
      summary: List PTY sessions
      description: Lists PTY sessions registered for the VM on this node.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PTY session list
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PtySessionResponse"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is owned by another node; connect to the owner
  /v1/vms/{id}/pty/sessions/{pty_id}:
    get:
      operationId: getPtySession
      summary: Get PTY session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pty_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PTY session record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PtySessionResponse"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: PTY session or VM not found
        "409":
          description: VM is owned by another node; connect to the owner
    delete:
      operationId: deletePtySession
      summary: Delete PTY session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pty_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: PTY session or VM not found
        "409":
          description: VM is owned by another node; connect to the owner
  /v1/vms/{id}/pty/sessions/{pty_id}/resize:
    post:
      operationId: resizePtySession
      summary: Resize PTY session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pty_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols:
                  type: integer
                  minimum: 1
                rows:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated PTY dimensions
          content:
            application/json:
              schema:
                type: object
                required: [pty_id, cols, rows]
                properties:
                  pty_id:
                    type: string
                    format: uuid
                  cols:
                    type: integer
                  rows:
                    type: integer
        "400":
          description: cols or rows is zero
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: PTY session or VM not found
        "409":
          description: VM is owned by another node; connect to the owner
  /v1/vms/{id}/pty/{pty_id}/connect:
    get:
      operationId: connectPty
      summary: Attach to PTY session (WebSocket)
      description: Upgrades to a WebSocket bridged to the guest PTY. Authenticates with the `token` query parameter carrying the one-time `connect_token` from the create-session response, not the X-API-Key header. Tokens expire after 5 minutes or on first successful connect. Global, authenticated-tenant, and VM active-connection limits are reserved before upgrade; a capacity rejection does not consume a valid token. Binary messages carry raw PTY bytes; text messages are JSON controls (client-to-server `{"type":"resize","cols":N,"rows":N}`, server-to-client `{"type":"exit","exit_code":N}`).
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pty_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Per-session connect token returned by the create-session call.
      responses:
        "101":
          description: Switching protocols to WebSocket
        "401":
          description: Connect token is missing, invalid, expired, reused, or unknown
        "429":
          description: Global, tenant, or VM active PTY capacity is exhausted; a valid token remains usable for retry
  /v1/vms/{id}/pause:
    post:
      operationId: pauseVm
      summary: Pause sandbox
      description: User keys can pause only their tenant's VMs; admin keys can pause any VM.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paused VM record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is stopped
  /v1/vms/{id}/resume:
    post:
      operationId: resumeVm
      summary: Resume sandbox
      description: User keys can resume only their tenant's VMs; admin keys can resume any VM.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumed VM record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is stopped
  /v1/vms/{id}/suspend:
    post:
      operationId: suspendVm
      summary: Suspend sandbox
      description: Drops resident guest memory while retaining VM ownership, quota, and scheduler reservations. Resume the VM before exec, snapshot, PTY, SSH, or pause operations.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Suspended VM record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is not running
  /v1/vms/{id}/hibernate:
    post:
      operationId: hibernateVm
      summary: Hibernate sandbox and release host capacity
      description: Atomically captures an authenticated live RAM/device/disk snapshot, stops the resident VMM, releases CPU, memory, cgroup, network, and scheduler capacity, and retains a tenant-owned logical VM record for secure resume.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Hibernated VM record with no resident runtime allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is not running
        "503":
          description: Remote hibernation is unavailable until fenced peer lifecycle routing is enabled
  /v1/vms/{id}/snapshot:
    post:
      operationId: snapshotVm
      summary: Snapshot sandbox
      description: User keys can snapshot only their tenant's VMs; admin keys can snapshot any VM. A running VM uses the bounded live pre-copy path; RAM, device state, and the private disk upper are captured at one atomic final-stop boundary. The response is an opaque handle; paths and physical host identity remain private.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                diff:
                  type: boolean
                  default: false
                  description: Must be false. Incremental orchestrator snapshots are disabled until durable parent-chain relocation is available.
      responses:
        "200":
          description: Opaque snapshot handle
          content:
            application/json:
              schema:
                type: object
                required: [snapshot_id]
                properties:
                  snapshot_id:
                    type: string
                    format: uuid
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "422":
          description: Incremental snapshots are disabled; retry with `diff=false`.
        "409":
          description: VM is stopped
  /v1/vms/{id}/fork:
    post:
      operationId: forkVm
      summary: Atomically fork a running sandbox
      description: Takes a bounded live snapshot of the running source, including RAM, device state, and its private disk upper at one fork point, then restores an isolated child with lazy UFFD memory and a new writable disk overlay. In fleet mode, a request received by a healthy non-owner node securely snapshots the source through session-fenced mTLS, localizes and verifies the artifact, requires the configured replica policy, and starts the child on that receiving node. Placement identifiers and host paths are never caller-controlled or returned. The source and child must belong to the authenticated tenant.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkVmRequest"
      responses:
        "201":
          description: Ready isolated child VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForkVmResponse"
        "401":
          description: Missing or invalid API key
        "403":
          description: Source VM belongs to a different tenant or tenant quota is reached
        "404":
          description: Source VM not found
        "409":
          description: Source is not running or the requested child id already exists
        "429":
          description: Host capacity is unavailable
        "503":
          description: A source peer/session, durable fleet, verified artifact replica, or configured replication policy is unavailable
  /v1/restore:
    post:
      operationId: restoreVm
      summary: Restore sandbox from a snapshot
      description: Restores a VM from an opaque snapshot handle. The control plane resolves its private host and storage locator; tenant VM quotas apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "201":
          description: Restored VM record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: Tenant VM quota reached
        "404":
          description: Snapshot handle or owning host not found
        "429":
          description: Selected node is at capacity
          headers:
            Retry-After:
              description: Seconds the client should wait before retrying
              schema:
                type: integer
                minimum: 1
  /v1/execute:
    post:
      operationId: execute
      summary: Execute command in sandbox (synchronous)
      description: Runs the command and returns the finished execution record in one request, no polling. The record is `completed` or `failed`; an exec that could not run at all is still a 200 with `status:"failed"` and `error` set. User keys can execute only in their tenant's VMs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "200":
          description: Finished execution record (completed or failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
  /v1/execute_async:
    post:
      operationId: executeAsync
      summary: Execute command in sandbox (async)
      description: User keys can execute only in their tenant's VMs; admin keys can execute in any VM. Poll the record with GET /v1/executions/{id} on the same node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "202":
          description: Execution accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
  /v1/executions/{id}:
    get:
      operationId: getExecution
      summary: Get execution status
      description: Returns execution status only if the caller can access the VM associated with the execution.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Execution record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRecord"
        "401":
          description: Missing or invalid API key
        "403":
          description: Execution belongs to a different tenant's VM
        "404":
          description: Execution not found
  /v1/egress/vm/{id}:
    patch:
      operationId: patchVmEgressPolicy
      summary: Update egress allowlist
      description: User keys can update egress only for their tenant's VMs; admin keys can update any VM.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowlist]
              properties:
                allowlist:
                  type: array
                  items:
                    type: string
                  description: Egress allow rules, for example "10.0.0.0/8:443/tcp".
                allow_existing:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Applied rule count
          content:
            application/json:
              schema:
                type: object
                required: [rules_applied]
                properties:
                  rules_applied:
                    type: integer
        "401":
