        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: VM is stopped
  /v1/vms/{id}/egress-policy:
    get:
      operationId: getVmEgressPolicy
      summary: Read durable desired egress policy
      description: Returns the tenant-scoped policy that survives hibernation. A VM with no explicit policy has revision 1 and default-deny semantics.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current desired policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EgressPolicy"
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
    put:
      operationId: setVmEgressPolicy
      summary: Compare-and-swap durable desired egress policy
      description: Persists the policy before applying it. For a hibernated VM it is installed during network provisioning before the resumed guest starts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, allowlist]
              properties:
                expected_revision:
                  type: integer
                  format: uint64
                  minimum: 1
                allowlist:
                  type: array
                  maxItems: 256
                  items:
                    type: string
                    maxLength: 128
                allow_existing:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Persisted desired policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EgressPolicy"
        "400":
          description: Invalid or excessive rule syntax
        "401":
          description: Missing or invalid API key
        "403":
          description: VM belongs to a different tenant
        "404":
          description: VM not found
        "409":
          description: Revision mismatch or invalid lifecycle state
  /v1/branches:
    get:
      operationId: listBranches
      summary: List tenant branches
      responses:
        "200":
          description: Tenant-scoped branch records
          content:
