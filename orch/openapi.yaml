              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
        "401":
          description: Missing or invalid API key
    post:
      operationId: createBranch
      summary: Create a tenant branch
      description: The optional caller-generated branch ID makes an identical replay idempotent. The head artifact and optional source identities must belong to the same tenant; only available, replication-ready artifacts can become branch heads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, head_artifact_id]
              properties:
                branch_id:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                head_artifact_id:
                  type: string
                  format: uuid
                source_vm_id:
                  type: string
                  format: uuid
                source_branch_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "200":
          description: Identical caller-ID replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          description: Invalid branch name
        "401":
          description: Missing or invalid API key
        "404":
          description: Tenant-owned head artifact or source not found
        "409":
          description: Branch ID or name conflicts with another branch
  /v1/branches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBranch
      summary: Get a tenant branch
      responses:
        "200":
          description: Branch record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "401":
          description: Missing or invalid API key
        "404":
          description: Branch not found for this tenant
    put:
      operationId: updateBranch
      summary: Compare-and-swap a branch head
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, head_artifact_id]
              properties:
                expected_revision:
                  type: integer
                  format: uint64
                  minimum: 1
                head_artifact_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          description: Invalid revision
        "401":
          description: Missing or invalid API key
