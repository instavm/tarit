        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Share belongs to another tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
