[package]
name = "tarit-volume"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
cloud-object-store = ["dep:futures-util", "dep:object_store", "dep:tokio"]
cloud-object-store-aws = ["cloud-object-store", "object_store/aws"]
cloud-object-store-azure = ["cloud-object-store", "object_store/azure"]

[dependencies]
libc = "0.2"
futures-util = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
object_store.workspace = true
