[project]
name = "tarit-sdk"
version = "0.1.2"
description = "A client library for accessing Tarit Orchestrator API"
authors = []
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["microvm", "virtualization", "sandbox"]
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
    "websockets>=15,<16",
]

[project.urls]
Homepage = "https://github.com/instavm/tarit"
Repository = "https://github.com/instavm/tarit"
Issues = "https://github.com/instavm/tarit/issues"

[tool.uv.build-backend]
module-name = "tarit_sdk"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
